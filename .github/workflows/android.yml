name: Android CI
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.country -Duser.language=en -Duser.variant -Dorg.gradle.configuration-cache=true"
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.1"
      - run: gradle testDebugUnitTest assembleDebug --stacktrace --warning-mode all
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Hyouka-SpaceBuds-Z-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
